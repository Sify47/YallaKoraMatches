name: Test Real Estate Scraping

on:
  # تشغيل يدوي فقط للاختبار
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test scraping immediately'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
  
  # لاحقاً يمكنك تفعيل الجدولة اليومية بعد التأكد من نجاح الاختبار
  # schedule:
  #   - cron: '0 2 * * *'  # 2 AM UTC = 4 AM Egypt Time

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Print start time
      run: |
        echo "🚀 Starting scraping test at $(date)"
        echo "Workflow triggered by: ${{ github.event_name }}"
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests beautifulsoup4 lxml
        echo "✅ Dependencies installed"
        
    - name: Run scraping script
      run: python scrape_data.py
      
    - name: Display results
      run: |
        echo "📊 Scraping completed!"
        if [ -f "scraping_metadata.txt" ]; then
          echo "📄 Metadata content:"
          cat scraping_metadata.txt
        fi
        if [ -f "Final1.csv" ]; then
          echo "📁 Final1.csv properties count:"
          wc -l Final1.csv || echo "Cannot count lines"
        fi
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # تحقق إذا كان هناك تغييرات
        git status
        
        # أضف الملفات إذا كانت هناك تغييرات
        if git diff --name-only | grep -q "Final1.csv\|scraping_metadata.txt"; then
          echo "📝 Changes detected, committing..."
          git add Final1.csv scraping_metadata.txt
          git commit -m "Test scrape: Update real estate data [$(date +'%Y-%m-%d %H:%M')]" || echo "No new changes to commit"
          
          # محاولة push مع إعادة المحاولة إذا فشلت
          max_retries=3
          counter=0
          while [ $counter -lt $max_retries ]; do
            git pull --rebase
            if git push; then
              echo "✅ Successfully pushed changes"
              break
            else
              echo "⚠️ Push failed, retrying... ($((counter+1))/$max_retries)"
              sleep 2
              counter=$((counter+1))
            fi
          done
          
          if [ $counter -eq $max_retries ]; then
            echo "❌ Failed to push after $max_retries attempts"
          fi
        else
          echo "✅ No changes to commit"
        fi
        
    - name: Create test summary
      run: |
        echo "### 🎉 Scraping Test Completed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Test Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "scraping_metadata.txt" ]; then
          echo "**Results:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat scraping_metadata.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "**Status:** No metadata file created" >> $GITHUB_STEP_SUMMARY
        fi
